<!DOCTYPE html>
<html>
<head>
    <!-- Text shown in the browser tab. -->
    <title>Let's Talk Legal Information</title>

    <!-- Basic styling for the webpage. -->
    <style>
        /* Controls the page font, width, spacing, and position. */
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Controls the size of the search box. */
        input {
            width: 60%;
            padding: 10px;
        }

        /* Controls the appearance of the search button. */
        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        /* Creates a box around each returned result. */
        .result {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
        }

        /* Adds spacing above the source link. */
        .source {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <!-- Main title displayed on the webpage. -->
    <h1>Let's Talk Legal Information</h1>

    <!-- Label and input where the user enters a question. -->
    <label for="question">Ask a legal question:</label>
    <br><br>

    <input type="text" id="question">

    <!-- Clicking this button starts the search function. -->
    <button onclick="searchLegalInformation()">Search</button>

    <!-- Search results will be displayed inside this element. -->
    <div id="result"></div>

    <script>
      // Sends the user's question to the PHP backend.
        async function searchLegalInformation() {

          // Read and clean the text entered by the user.
            const question =
                document.getElementById("question").value.trim();

                // Find the area where results will be displayed.
            const result = document.getElementById("result");

          // Clear results from any previous search.
            result.innerHTML = "";

           // Prevent searches that are too short.
            if (question.length < 3) {
                result.textContent =
                    "Please enter at least 3 characters.";
                return;
            }

         // Send the question to api.php using an AJAX request.
            const response = await fetch(
                "api.php?question=" + encodeURIComponent(question)
            );

         // Convert the JSON response into JavaScript data.
            const data = await response.json();

         // Display a message if the database found no matches.
            if (data.length === 0) {
                result.textContent =
                    "No matching information was found.";
                return;
            }

         // Display every matching legal-information record.
            data.forEach(function(item) {

                  // Create a box for one legal-information result.
                const resultBox = document.createElement("div");
                resultBox.className = "result";

              // Display the question from the database.
                const questionTitle = document.createElement("h2");
                questionTitle.textContent = item.question;

                  // Display the answer from the database.
                const answer = document.createElement("p");
                answer.textContent = item.answer;

              // Create the source paragraph.
                const source = document.createElement("p");
                source.className = "source";
                source.textContent = "Source: ";

               // Create a clickable link to the official source.
                const sourceLink = document.createElement("a");
                sourceLink.href = item.source_url;
                sourceLink.textContent = item.source_name;
                sourceLink.target = "_blank";

                // Place the source link inside the source paragraph.
                source.appendChild(sourceLink);

               // Place all information inside the result box.
                resultBox.appendChild(questionTitle);
                resultBox.appendChild(answer);
                resultBox.appendChild(source);

                 // Place the completed result on the webpage.
                result.appendChild(resultBox);
            });
        }
    </script>
</body>
</html>
